x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: yumikokawaii/agon:latest
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-akashic-postgres-1}
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-agon}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-agon}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      WT_HOST: ${WT_HOST:-agon.io.vn}
      WT_PORT: "4433"
    ports:
      - "127.0.0.1:${SERVER_PORT:-7777}:7777/tcp"
      - "4433:4433/udp"
    networks:
      - default
      - shared-db
    logging: *logging

networks:
  shared-db:
    external: true
    name: ${DB_NETWORK:-akashic_default}
