services:
  app:
    build: .
    image: agon:local
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-agon}
      DB_PASSWORD: ${DB_PASSWORD:-agon}
      DB_NAME: ${DB_NAME:-agon}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      WT_HOST: ${WT_HOST:-localhost}
      WT_PORT: "4433"
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080/tcp"
      - "${WT_BIND:-127.0.0.1}:4433:4433/udp"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-agon}
      MYSQL_USER: ${DB_USER:-agon}
      MYSQL_PASSWORD: ${DB_PASSWORD:-agon}
      MYSQL_DATABASE: ${DB_NAME:-agon}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - agon-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-agon}"]
      interval: 3s
      retries: 30

volumes:
  agon-mysql:
