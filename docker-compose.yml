services:
  app:
    build: .
    image: agon:local
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-agon}
      DB_PASSWORD: ${DB_PASSWORD:-agon}
      DB_NAME: ${DB_NAME:-agon}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      WT_HOST: ${WT_HOST:-localhost}
      WT_PORT: "4433"
    ports:
      - "127.0.0.1:${SERVER_PORT:-7777}:7777/tcp"
      - "[::1]:${SERVER_PORT:-7777}:7777/tcp"
      - "127.0.0.1:4433:4433/udp"
      - "[::1]:4433:4433/udp"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-agon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agon}
      POSTGRES_DB: ${DB_NAME:-agon}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agon-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 30

volumes:
  agon-postgres:
