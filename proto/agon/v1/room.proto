syntax = "proto3";

package agon.v1;

option go_package = "github.com/yumikokawaii/agon/gen/agon/v1;agonv1";

service RoomService {
  rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse);
  rpc JoinRoom(JoinRoomRequest) returns (JoinRoomResponse);
  rpc LeaveRoom(LeaveRoomRequest) returns (LeaveRoomResponse);
  rpc GetRoom(GetRoomRequest) returns (GetRoomResponse);
  rpc WatchRoom(WatchRoomRequest) returns (stream WatchRoomResponse);
  rpc SetReady(SetReadyRequest) returns (SetReadyResponse);
}

enum RoomState {
  ROOM_STATE_UNSPECIFIED = 0;
  ROOM_STATE_WAITING = 1;
  ROOM_STATE_PLAYING = 2;
  ROOM_STATE_CLOSED = 3;
}

message Seat {
  string username = 1;
  int32 kit = 2;
  bool ready = 3;
}

message Room {
  string id = 1;
  Seat host = 2;
  Seat guest = 3;
  RoomState state = 4;
  string match_id = 5;
}

message CreateRoomRequest {}

message CreateRoomResponse {
  Room room = 1;
}

message JoinRoomRequest {
  string room_id = 1;
}

message JoinRoomResponse {
  Room room = 1;
}

message LeaveRoomRequest {
  string room_id = 1;
}

message LeaveRoomResponse {}

message GetRoomRequest {
  string room_id = 1;
}

message GetRoomResponse {
  Room room = 1;
}

message WatchRoomRequest {
  string room_id = 1;
}

message WatchRoomResponse {
  Room room = 1;
}

message SetReadyRequest {
  string room_id = 1;
  bool ready = 2;
}

message SetReadyResponse {
  Room room = 1;
}
