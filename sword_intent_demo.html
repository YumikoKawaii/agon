<!doctype html>
<html><head><meta charset="utf-8"><title>Sword Intent Demo</title>
<style>
body{margin:0;background:#1b1a24;color:#e8e4f4;font:13px monospace;display:flex;flex-direction:column;align-items:center}
canvas{background:#2a3b38;image-rendering:pixelated;margin-top:8px;cursor:crosshair;max-width:100%}
#ui{padding:6px}
</style></head><body>
<div id="ui">WASD move · LMB swift cut x3 (3rd = Sword Intent wave) · Q swallow · E wind step · R formation · bot HP <b id="hp"></b> · bleed <b id="bl"></b></div>
<canvas id="c" width="960" height="600"></canvas>
<script>
const S=3,W=320,H=200,R=8,DT=1/60;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const P={x:80,y:100,ang:0,combo:0,cd:0,comboT:0,charges:2,chT:0,lunge:0,dir:{x:1,y:0}};
const B={x:230,y:100,hp:80,bleed:0,bleedT:0,flash:0,vx:0,t:0};
const m={x:200,y:100},keys={};
let fx=[],waves=[],forms=[],texts=[],cds={Q:0,E:0,R:0};
const INTENT={speed:260,range:150,half:0.9,r:26,dmg:6,pop:4,width:10};
cv.onmousemove=e=>{const b=cv.getBoundingClientRect();m.x=(e.clientX-b.left)/b.width*W;m.y=(e.clientY-b.top)/b.height*H};
onkeydown=e=>{keys[e.key.toLowerCase()]=1;skill(e.key.toUpperCase())};onkeyup=e=>keys[e.key.toLowerCase()]=0;
cv.onmousedown=()=>cut();
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function facing(){const d=Math.hypot(m.x-P.x,m.y-P.y)||1;return{x:(m.x-P.x)/d,y:(m.y-P.y)/d}}
function hit(d,bleed,big){B.hp-=d;B.flash=0.15;texts.push({x:B.x,y:B.y-14,t:0.8,s:d,c:big?'#ffd76a':'#fff'});if(bleed){B.bleed=Math.min(B.bleed+1,5);B.bleedT=3}if(B.hp<=0)B.hp=80}
function pop(){const s=B.bleed;B.bleed=0;return s*INTENT.pop}
function cut(){
  if(P.cd>0||P.lunge>0)return;
  P.combo=P.comboT>0?P.combo%3+1:1;P.comboT=0.7;P.cd=P.combo==3?0.45:0.22;
  const f=facing(),a=Math.atan2(f.y,f.x);
  if(P.combo<3){
    const r=22,half=1.05,side=P.combo%2?1:-1;
    fx.push({k:'arc',x:P.x,y:P.y,a,r,half,side,t:0,life:0.16});
    const to={x:B.x-P.x,y:B.y-P.y},ad=Math.abs(Math.atan2(to.y,to.x)-a);
    if(Math.hypot(to.x,to.y)<r+R&&Math.min(ad,2*Math.PI-ad)<half)hit(4,true);
  }else{
    fx.push({k:'arc',x:P.x,y:P.y,a,r:INTENT.r,half:1.5,side:1,t:0,life:0.2,big:1});
    waves.push({x:P.x,y:P.y,dx:f.x,dy:f.y,a,trav:0,hit:false});
  }
}
function skill(k){
  const f=facing();
  if(k=='Q'&&cds.Q<=0){cds.Q=3;P.lunge=9;P.dir=f;P.lh=false}
  if(k=='E'&&P.charges>0){P.charges--;const sx=P.x,sy=P.y,d=Math.min(Math.max(dist(P,m),39),65);P.x+=f.x*d;P.y+=f.y*d;clamp(P);
    for(let n=0;n<4;n++)fx.push({k:'ghost',x:sx+(P.x-sx)*n/4,y:sy+(P.y-sy)*n/4,t:0,life:0.15+n*0.05});
    if(seg(B,{x:sx,y:sy},P)<R+8)hit(6,false)}
  if(k=='R'&&cds.R<=0){cds.R=8;const v={x:m.x-P.x,y:m.y-P.y},l=Math.hypot(v.x,v.y),s=Math.min(l,130)/(l||1);
    forms.push({x:P.x+v.x*s,y:P.y+v.y*s,t:0,base:Math.random()*6.28,hit:Array(8).fill(false)})}
}
function seg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/l));return Math.hypot(p.x-a.x-dx*t,p.y-a.y-dy*t)}
function clamp(o){o.x=Math.max(R,Math.min(W-R,o.x));o.y=Math.max(R,Math.min(H-R,o.y))}
function step(){
  P.cd-=DT;P.comboT-=DT;for(const k in cds)cds[k]-=DT;
  if(P.charges<2){P.chT+=DT;if(P.chT>4){P.charges++;P.chT=0}}
  if(P.lunge>0){P.lunge--;P.x+=P.dir.x*52/9;P.y+=P.dir.y*52/9;clamp(P);fx.push({k:'ghost',x:P.x,y:P.y,t:0,life:0.2});
    if(!P.lh&&seg(B,P,{x:P.x+P.dir.x*12,y:P.y+P.dir.y*12})<R+5){P.lh=true;hit(7,true,true);P.charges=Math.min(2,P.charges+1)}}
  else{let vx=(keys.d|0)-(keys.a|0),vy=(keys.s|0)-(keys.w|0),l=Math.hypot(vx,vy)||1;P.x+=vx/l*90*DT;P.y+=vy/l*90*DT;clamp(P)}
  B.t+=DT;B.y=100+Math.sin(B.t*0.9)*60;B.x=230+Math.cos(B.t*0.6)*40;B.flash-=DT;
  if(B.bleed){B.bleedT-=DT;if(B.bleedT<=0)B.bleed=0}
  waves=waves.filter(w=>{const sp=INTENT.speed*DT;w.x+=w.dx*sp;w.y+=w.dy*sp;w.trav+=sp;
    if(!w.hit){const px=-w.dy,py=w.dx,rx=B.x-w.x,ry=B.y-w.y,along=rx*w.dx+ry*w.dy,side=rx*px+ry*py;
      if(Math.abs(along)<INTENT.width&&Math.abs(side)<INTENT.r){w.hit=true;const p=pop();hit(INTENT.dmg+p,false,true);if(p)fx.push({k:'pop',x:B.x,y:B.y,t:0,life:0.35})}}
    if(w.trav>INTENT.range||w.x<0||w.x>W||w.y<0||w.y>H){fx.push({k:'fade',x:w.x,y:w.y,a:w.a,t:0,life:0.2});return false}return true});
  forms=forms.filter(f=>{f.t+=DT;for(let n=0;n<8;n++){const st=(f.t-0.6-n*0.06)/0.14;if(st<0||st>1||f.hit[n])continue;const a=f.base+n*0.785,s=1-2*st;
    if(dist(B,{x:f.x+Math.cos(a)*36*s,y:f.y+Math.sin(a)*36*s})<R+5){f.hit[n]=true;hit(3,true)}}return f.t<1.3});
  fx=fx.filter(e=>(e.t+=DT)<e.life);texts=texts.filter(t=>(t.y-=20*DT,(t.t-=DT)>0));
}
function crescent(x,y,a,r,alpha,big){
  g.save();g.translate(x*S,y*S);g.rotate(a);g.globalAlpha=alpha;
  g.fillStyle=big?'#bff7ea':'#e9fbff';g.shadowColor='#7fe8d0';g.shadowBlur=18;
  g.beginPath();g.arc(-r*S*0.6,0,r*S,-1.0,1.0);g.arc(-r*S*0.95,0,r*S*0.92,0.95,-0.95,true);g.fill();
  g.globalAlpha=alpha*0.5;g.fillStyle='#c7b3ff';g.beginPath();g.arc(-r*S*0.75,0,r*S*0.9,-0.9,0.9);g.arc(-r*S*1.05,0,r*S*0.85,0.85,-0.85,true);g.fill();
  g.restore();
}
function draw(){
  g.clearRect(0,0,cv.width,cv.height);g.fillStyle='#2f4541';for(let i=0;i<W;i+=20)for(let j=0;j<H;j+=20)if((i+j)/20%2)g.fillRect(i*S,j*S,20*S,20*S);
  for(const f of forms){g.strokeStyle='rgba(199,179,255,.5)';g.lineWidth=2;g.beginPath();g.arc(f.x*S,f.y*S,36*S,0,7);g.stroke();
    for(let n=0;n<8;n++){const st=Math.max(0,Math.min(1,(f.t-0.6-n*0.06)/0.14)),a=f.base+n*0.785,s=1-2*st,sx=f.x+Math.cos(a)*36*s,sy=f.y+Math.sin(a)*36*s;
      g.save();g.translate(sx*S,sy*S);g.rotate(a+Math.PI);g.fillStyle='#e9fbff';g.fillRect(-12,-2,24,4);g.fillStyle='#ffd76a';g.fillRect(-14,-4,4,8);g.restore()}}
  for(const e of fx){const k=1-e.t/e.life;
    if(e.k=='arc'){g.strokeStyle=e.big?`rgba(191,247,234,${k})`:`rgba(255,255,255,${k})`;g.lineWidth=e.big?8:5;g.beginPath();g.arc(e.x*S,e.y*S,e.r*S,e.a-e.half,e.a+e.half);g.stroke()}
    if(e.k=='ghost'){g.fillStyle=`rgba(127,232,208,${k*0.4})`;g.beginPath();g.arc(e.x*S,e.y*S,R*S,0,7);g.fill()}
    if(e.k=='fade')crescent(e.x,e.y,e.a,INTENT.r*(1+e.t*3),k*0.6,1);
    if(e.k=='pop'){g.strokeStyle=`rgba(255,90,110,${k})`;g.lineWidth=4;g.beginPath();g.arc(e.x*S,e.y*S,(10+e.t*60)*S,0,7);g.stroke()}}
  for(const w of waves)crescent(w.x,w.y,w.a,INTENT.r,1,1);
  g.fillStyle=B.flash>0?'#fff':'#c96b7c';g.beginPath();g.arc(B.x*S,B.y*S,R*S,0,7);g.fill();
  for(let i=0;i<B.bleed;i++){g.fillStyle='#ff4d6a';g.fillRect((B.x-10+i*5)*S,(B.y-R-6)*S,9,9)}
  g.fillStyle='#bff7ea';g.beginPath();g.arc(P.x*S,P.y*S,R*S,0,7);g.fill();
  const f=facing();g.strokeStyle='#ffd76a';g.lineWidth=3;g.beginPath();g.moveTo(P.x*S,P.y*S);g.lineTo((P.x+f.x*14)*S,(P.y+f.y*14)*S);g.stroke();
  if(P.comboT>0&&P.combo==2){g.strokeStyle='rgba(191,247,234,.35)';g.setLineDash([6,6]);g.beginPath();g.moveTo(P.x*S,P.y*S);g.lineTo((P.x+f.x*INTENT.range)*S,(P.y+f.y*INTENT.range)*S);g.stroke();g.setLineDash([])}
  g.font='bold 18px monospace';for(const t of texts){g.fillStyle=t.c;g.fillText(t.s,t.x*S,t.y*S)}
  g.fillStyle='#e8e4f4';g.font='14px monospace';g.fillText(`combo ${P.comboT>0?P.combo:0}/3  E charges ${P.charges}  Q ${Math.max(0,cds.Q).toFixed(1)}  R ${Math.max(0,cds.R).toFixed(1)}`,10,cv.height-10);
  document.getElementById('hp').textContent=B.hp;document.getElementById('bl').textContent=B.bleed;
}
(function loop(){step();draw();requestAnimationFrame(loop)})();
</script></body></html>
